version: "3.8"

services:
  patent-extractor:
    build: .
    container_name: patent-jsonl-extractor
    ports:
      - "8020:8020"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      - MAX_FILE_SIZE=524288000
      - LLM_API_BASE=http://172.17.128.1:7000
      - LLM_API_KEY=sk-litellmXa304304
      - LLM_MODEL=claude-haiku-4-5-20251001
      - LLM_MAX_TOKENS=16000
      - LLM_USE_LLM=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
